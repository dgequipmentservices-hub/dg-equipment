<div class="scr" id="S_diagrams">
  <div class="hdr">
    <div class="hdr-l"><button class="back-btn" onclick="goBack()">&#8592;</button><div class="hdr-title">Parts Diagrams</div></div>
    <div class="hdr-r"><button class="pbtn" onclick="dgmUploadStart()">+ Add</button></div>
  </div>
  <div style="padding:10px 14px 4px">
    <div class="crow" id="dgmBrandRow"></div>
  </div>
  <div style="padding:8px 14px 6px">
    <div class="sw"><input class="sinp" id="dgmSearch" placeholder="Search model — srm225, ws36&hellip;" oninput="renderDiagrams()" autocomplete="off"></div>
  </div>
  <div class="lst" id="dgmList" style="flex:1;overflow-y:auto;padding:0 14px 90px"></div>
</div>

<div class="scr" id="S_dgmParts">
  <div class="hdr">
    <div class="hdr-l"><button class="back-btn" onclick="goBack()">&#8592;</button><div><div class="htitle" id="dgmPartsTitle">Parts</div><div class="hsub" id="dgmPartsSub"></div></div></div>
    <div class="hdr-r"><button class="ibtn" onclick="dgmEditDiagram()" title="Edit"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg></button><button class="ibtn" onclick="openDiagramImage()" title="View diagram" id="dgmImgBtn" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button></div>
  </div>
  <div style="padding:10px 14px 6px">
    <div class="sw"><input class="sinp" id="dgmPartsSearch" placeholder="Filter this list&hellip;" oninput="renderDiagramParts()" autocomplete="off"><span class="sico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span></div>
  </div>
  <div class="lst" id="dgmPartsList" style="flex:1;overflow-y:auto;padding:0 14px 90px"></div>
</div>
