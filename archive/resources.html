<div class="scr" id="S_resources">
  <div class="hdr">

    </div>
  </div>
  <div style="padding:10px 14px 0;flex-shrink:0">

      <button class="ccat on" data-rc="All" onclick="setResCat(this)">All</button>
      <button class="ccat" data-rc="Belts" onclick="setResCat(this)">Belts</button>
      <button class="ccat" data-rc="Blades" onclick="setResCat(this)">Blades</button>
      <button class="ccat" data-rc="Spark Plugs" onclick="setResCat(this)">Spark Plugs</button>
      <button class="ccat" data-rc="Carburetor" onclick="setResCat(this)">Carburetor</button>
      <button class="ccat" data-rc="Fuel System" onclick="setResCat(this)">Fuel</button>
      <button class="ccat" data-rc="Engine Oil" onclick="setResCat(this)">Oil</button>
      <button class="ccat" data-rc="Tires" onclick="setResCat(this)">Tires</button>
      <button class="ccat" data-rc="General" onclick="setResCat(this)">General</button>
    </div>

  <div style="flex:1;overflow-y:auto;padding:6px 14px 80px" id="resourcesBody"></div>
