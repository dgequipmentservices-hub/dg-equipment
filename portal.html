<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://ddxjszzceaullxheejnq.supabase.co; connect-src https://ddxjszzceaullxheejnq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191c20">
<title>DG Equipment Repair — My Account</title>
<link rel="icon" href="portal-logo.png">
<link rel="apple-touch-icon" href="portal-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--sf:#fff;--sf2:#eef0f2;--bd:#e7e9ec;--bd2:#dcdfe3;
  --tx:#191c20;--tx2:#565d66;--tx3:#6f7680;
  --red:#c81f33;--grn:#1f8a58;--amb:#8a6209;--blu:#2467b0;--pur:#6b4fd0;--pur2:#4a33a8;
  --ink:#191c20;--r:16px;
  --fn:'DM Sans',system-ui,-apple-system,sans-serif;--mo:'DM Mono',ui-monospace,monospace;--st:'Stardos Stencil',var(--fn);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fn);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--blu)}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
.money{font-family:var(--mo);font-weight:500;white-space:nowrap}

/* top bars */
.hero{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 40px) 24px 36px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:52px;height:52px;object-fit:contain}
.brand b{font-family:var(--st);font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;font-weight:700}
.hero h1{margin:22px 0 0;font-size:28px;line-height:1.15}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:4px}
.bar .t{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx);cursor:pointer;flex-shrink:0}
.ib:active{background:var(--sf2)}

/* blocks */
.pad{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px}
.lbl{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
h2{margin:8px 2px 0;font-size:18px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hr{height:1px;background:var(--bd);margin:6px 0}
.muted{color:var(--tx2)}
.small{font-size:13px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.unpaid{color:var(--amb);background:#fbf3df}
.chip.partial{color:var(--blu);background:#e4eef9}
.chip.paid{color:var(--grn);background:#e3f3ea}
.chip.pref{color:#fff;background:var(--pur)}

/* buttons */
.btn{height:54px;border-radius:14px;border:0;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;width:100%;padding:0 16px}
.btn:disabled{opacity:.55;cursor:default}
.btn.red{background:var(--red);color:#fff}
.btn.pur{background:var(--pur);color:#fff}
.btn.grn{background:var(--grn);color:#fff}
.btn.line{background:#fff;border:1.5px solid var(--bd2);color:var(--tx);height:48px;font-size:15px}
.btn.soft{background:var(--sf2);color:var(--tx);height:44px;font-size:14px}
.btn .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.22)}
.lnk{background:none;border:0;color:var(--blu);font-weight:600;font-size:14px;cursor:pointer;padding:10px 0}

/* inputs */
label.f{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.in{width:100%;height:54px;border:1.5px solid var(--bd2);border-radius:12px;padding:0 16px;font-size:18px;font-family:inherit;background:#fff;color:var(--tx)}
.in:focus,textarea:focus{outline:2px solid var(--blu);outline-offset:1px;border-color:transparent}
textarea.in{height:110px;padding:12px 14px;font-size:15px;resize:vertical}
.in.sm{height:50px;font-size:15px}
.code{font-family:var(--mo);font-size:30px;letter-spacing:.5em;text-align:center;padding-left:.5em}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:0}
.note{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.45}

/* list items */
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--tx);cursor:pointer;width:100%;text-align:left;font-size:15px}
.item:active{background:var(--sf2)}
.item .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx2)}

/* home */
.homehead{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 84px}
.homehead .top{display:flex;align-items:center;justify-content:space-between}
.homehead .brand img{width:40px;height:40px}
.homehead .brand b{font-size:14px}
.hi{font-size:26px;font-weight:700;margin-top:18px}
.owe{margin:-64px 16px 0;background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(18,22,30,.14);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative}
.big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.01em}
.av{width:44px;height:44px;border-radius:22px;border:0;background:#2b3036;color:#fff;font-weight:700;font-size:15px;cursor:pointer}

/* pay boxes */
.zbox{background:#f1edfc;border:1.5px solid var(--pur);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.zrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:6px 6px 6px 14px;margin-top:4px}
.zstep{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--tx)}
.zn{width:26px;height:26px;border-radius:13px;background:var(--pur);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.zrow>.zv{flex:1;min-width:0}
.zl{font-size:12px;color:var(--tx2)}
.zv{font-weight:700;font-size:17px;word-break:break-all}
.zcp{flex-shrink:0;min-width:76px;height:44px;border-radius:10px;border:1.5px solid var(--pur);background:#fff;color:var(--pur2);font-weight:700;font-size:14px;cursor:pointer}
.zcp.on{background:var(--pur);color:#fff}
.zgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zcell{background:#fff;border-radius:10px;padding:10px 12px}
.zcell div:first-child{font-size:12px;color:var(--tx2)}
.zcell div:last-child{font-weight:700;font-size:15px;word-break:break-all}

/* statement */
.aging{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.aging div{background:var(--sf2);border-radius:10px;padding:8px 4px;text-align:center}
.aging span{display:block;font-size:11px;color:var(--tx2)}
.aging b{font-family:var(--mo);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#e4e7ea;padding:4px;border-radius:12px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--tx2);font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--tx);font-weight:700}
.led{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.lr{display:grid;grid-template-columns:54px minmax(0,1fr) 76px 76px;gap:8px;padding:12px 14px;font-size:14px;border-bottom:1px solid #eef0f2;align-items:center}
.lr:last-child{border-bottom:0}
.lr.h{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.lr .num{text-align:right;font-family:var(--mo)}
.lr .pm{color:var(--grn);font-weight:600}

/* misc */
.tl{display:flex;gap:12px}
.tl i{width:10px;height:10px;border-radius:5px;background:var(--bd2);margin-top:7px;flex-shrink:0}
.tl:first-child i{background:var(--red)}
.remind{background:#e4eef9;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;color:#1a4f8a;font-size:14px}
.contact{display:flex;flex-direction:column;gap:12px}
.contact .who{display:flex;align-items:center;gap:12px}
.contact img{width:44px;height:44px;object-fit:contain}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--bd2);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.done{text-align:center;padding:30px 10px}
.done svg{margin:0 auto 10px;display:block}

/* print: invoice / statement as a clean page */
.printhead{display:none}
@media print{
  body{background:#fff}
  .bar,.noprint,.toast{display:none!important}
  .printhead{display:flex;justify-content:space-between;align-items:center;padding:0 0 12px;border-bottom:2px solid #191c20;margin-bottom:12px}
  .printhead img{width:48px;height:48px}
  .card,.led,.zbox{border:1px solid #ccc;break-inside:avoid}
  .pad{padding:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin" role="status" aria-label="Loading"></div></div>

<script>
'use strict';
var API='https://ddxjszzceaullxheejnq.supabase.co/functions/v1/portal';
var SHOP={name:'DG Equipment Repair & Services',owner:'Danny Gustus',phone:'(516) 350-8898',phone_digits:'5163508898',email:'dgequipmentservices@gmail.com'};
var CFG={sms:false,email:true};
var D=null;          // the customer's data, from the server
var ST={contact:'',kind:'',sentTo:'',stRange:'90',reqPhoto:''};
var app=document.getElementById('app');

// ── tiny helpers ────────────────────────────────────────────────────
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function money(n){n=Number(n)||0;return(n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(iso,opt){if(!iso)return'';var d=new Date(String(iso).length===10?iso+'T12:00:00':iso);if(isNaN(d))return'';return d.toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',timeZone:'America/New_York'},opt||{}));}
function fdy(iso){return fd(iso,{year:'numeric'});}
function fphone(d){d=String(d||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):d;}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
var I={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  print:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  lock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f8a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:1px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  mower:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="17" r="3"/><circle cx="18" cy="17" r="2"/><path d="M4 14l2-6h7l3 4h4v5h-1M10 17h6"/></svg>',
  tool:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
  cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2467b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  check:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1f8a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3L17 9"/></svg>'
};

// ── session ─────────────────────────────────────────────────────────
function getTok(){try{return localStorage.getItem('dg_portal')||sessionStorage.getItem('dg_portal')||'';}catch(e){return window._tok||'';}}
function setTok(t,remember){window._tok=t;try{localStorage.removeItem('dg_portal');sessionStorage.removeItem('dg_portal');if(t)(remember?localStorage:sessionStorage).setItem('dg_portal',t);}catch(e){}}

async function call(action,body){
  var h={'Content-Type':'application/json'};var t=getTok();if(t)h['x-portal-token']=t;
  var r,d;
  try{r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},body||{}))});}
  catch(e){return{error:navigator.onLine?'Couldn’t reach us. Try again.':'No internet connection.'};}
  try{d=await r.json();}catch(e){d={error:'Something went wrong. Call or text '+SHOP.phone+'.'};}
  if(r.status===401&&d.signed_out){setTok('');D=null;if(action!=='signout'){location.hash='';render();}}
  return d;
}
function track(ev,ref){call('log',{event:ev,ref:ref||''});}

// ── routing: #/invoice/<id>, #/machine/<id>, #/statement, #/request ──
function go(h){location.hash=h;}
var NAV=0;
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace(/^#\/?/,'');NAV=h?NAV+1:0;render();window.scrollTo(0,0);});

async function boot(){
  var c=await call('config');
  if(c&&!c.error){CFG.sms=!!c.sms;CFG.email=!!c.email;if(c.shop)SHOP=c.shop;}
  ST.kind=CFG.sms?'phone':'email';
  if(getTok()){await load();}
  render();
}
async function load(){
  var d=await call('data');
  if(d&&!d.error){D=d;if(d.shop)SHOP=d.shop;return true;}
  if(d&&d.error&&!d.signed_out)toast(d.error);
  return false;
}

function render(){
  if(!D){
    if(ST.step==='code')return viewCode();
    return viewSignIn();
  }
  var p=(location.hash||'').replace(/^#\/?/,'').split('/');
  if(p[0]==='invoice')return viewInvoice(p[1],p[2]==='zelle');
  if(p[0]==='machine')return viewMachine(p[1]);
  if(p[0]==='statement')return viewStatement();
  if(p[0]==='request')return viewRequest(p[1]||'');
  if(p[0]==='invoices')return viewAllInvoices();
  if(p[0]==='payments')return viewPayments();
  return viewHome();
}

// ── sign in ─────────────────────────────────────────────────────────
function viewSignIn(){
  var phone=ST.kind==='phone';
  app.innerHTML=
  '<div class="hero"><div class="brand"><img src="portal-logo.png" alt="DG Equipment Repair logo"><b>DG Equipment<br>Repair</b></div>'+
  '<h1>Your machines, invoices and payments — in one place.</h1></div>'+
  '<form class="pad" id="fStart" style="padding:28px 24px;gap:18px" novalidate>'+
    '<div><label class="f" for="contact">'+(phone?'Your cell number':'Your email')+'</label>'+
    '<input class="in" id="contact" '+(phone?'type="tel" inputmode="tel" autocomplete="tel" placeholder="(516) 555-0123"':'type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"')+' value="'+esc(ST.contact)+'">'+
    '<div class="small muted" style="margin-top:6px">Use the '+(phone?'number':'email')+' DG Equipment has on file for you.</div></div>'+
    '<div class="err" id="err" role="alert"></div>'+
    '<button class="btn red" id="goBtn" type="submit">'+(phone?'Text me a code':'Email me a code')+'</button>'+
    ((CFG.sms&&CFG.email)?'<button class="lnk" type="button" id="swap">'+(phone?'Use my email instead':'Use my cell number instead')+'</button>':'')+
    '<div class="card note">'+I.lock+'<div>No password to remember. We send a 6‑digit code each time — only you can see your account.</div></div>'+
  '</form>'+
  '<div class="small muted" style="margin-top:auto;padding:0 24px 30px;text-align:center;line-height:1.6">Not on file or number changed? Contact '+esc(SHOP.owner)+'<br><a href="tel:'+esc(SHOP.phone_digits)+'">'+esc(SHOP.phone)+'</a> · <a href="mailto:'+esc(SHOP.email)+'">'+esc(SHOP.email)+'</a></div>';
  $('fStart').onsubmit=function(e){e.preventDefault();sendCode();};
  if($('swap'))$('swap').onclick=function(){ST.kind=ST.kind==='phone'?'email':'phone';ST.contact='';render();};
}
async function sendCode(){
  var v=$('contact').value.trim();ST.contact=v;
  if(!v){$('err').textContent=ST.kind==='phone'?'Enter your cell number.':'Enter your email.';return;}
  var b=$('goBtn');b.disabled=true;b.textContent='Sending…';
  var d=await call('start',{contact:v});
  if(d.error){$('err').textContent=d.error;b.disabled=false;b.textContent=ST.kind==='phone'?'Text me a code':'Email me a code';if(d.use_email&&CFG.email){ST.kind='email';}return;}
  ST.sentTo=d.sent_to;ST.via=d.kind;ST.step='code';render();
}
function viewCode(){
  var sms=ST.via==='phone';
  app.innerHTML=
  '<div class="bar" style="border:0;background:transparent"><button class="ib" id="bk" aria-label="Back">'+I.back+'</button></div>'+
  '<form class="pad" id="fCode" style="padding:16px 24px;gap:20px" novalidate>'+
    '<div><h1 style="margin:0 0 6px;font-size:28px;line-height:1.2">Check your '+(sms?'texts':'email')+'</h1>'+
    '<div class="muted">If <b style="color:var(--tx)">'+esc(ST.sentTo)+'</b> is on file, a 6‑digit code is on its way. It works for 10 minutes.</div></div>'+
    '<div><label class="f" for="code">Code</label><input class="in code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="······"></div>'+
    '<label style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px"><input type="checkbox" id="rem" checked style="width:22px;height:22px;accent-color:var(--red)"> Keep me signed in on this phone</label>'+
    '<div class="err" id="err" role="alert"></div>'+
    '<button class="btn red" id="goBtn" type="submit">Sign in</button>'+
    '<div style="display:flex;justify-content:space-between"><button class="lnk" type="button" id="again">Send a new code</button><button class="lnk" type="button" id="wrong">Wrong '+(sms?'number':'email')+'?</button></div>'+
    (sms?'':'<div class="small muted">Not there? Check spam or promotions for an email from DG Equipment Repair.</div>')+
  '</form>';
  var ci=$('code');setTimeout(function(){ci.focus();},50);
  ci.oninput=function(){ci.value=ci.value.replace(/\D/g,'').slice(0,6);if(ci.value.length===6)checkCode();};
  $('fCode').onsubmit=function(e){e.preventDefault();checkCode();};
  $('bk').onclick=$('wrong').onclick=function(){ST.step='';render();};

async function checkCode(){
  var b=$('goBtn');if(b.disabled)return;
  var code=$('code').value;if(code.length!==6){$('err').textContent='Enter all 6 digits.';return;}
  b.disabled=true;b.textContent='Checking…';
  var rem=$('rem').checked;
  var d=await call('verify',{contact:ST.contact,code:code,remember:rem});
  if(d.error){$('err').textContent=d.error;b.disabled=false;b.textContent='Sign in';if(d.expired){$('code').value='';}return;}

// Phone photos are 3–8 MB; send a 1600px JPEG instead.
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));};
    img.onerror=function(){URL.revokeObjectURL(url);rej();};img.src=url;
  });
}

// ── statement ───────────────────────────────────────────────────────
function viewStatement(){
  var s=D.statement;track('view_statement');
  var now=new Date(),from=null;
  if(ST.stRange==='90')from=new Date(now.getTime()-90*864e5);
  else if(ST.stRange==='year')from=new Date(now.getFullYear(),0,1);
  // Open invoices always show, so the list adds up to what's owed; so does
  // an older invoice a payment in range went toward.
  var inR=function(r){return!from||new Date(r.date)>=from;};
  var payIds={};s.rows.forEach(function(r){if(r.type==='payment'&&inR(r))payIds[r.id]=1;});
  var rows=s.rows.filter(function(r){if(r.type==='invoice'&&!r.paidOff)return true;if(r.type==='invoice'&&payIds[r.id])return true;return inR(r);});
  var h=bar('Statement','Print or save as PDF')+'<div class="pad">'+printHead('Statement · '+fdy(s.as_of));
  h+='<div class="card"><div class="muted small">Balance as of '+fdy(s.as_of)+'</div><div style="font-size:36px;font-weight:700;line-height:1.15">'+money(s.balance)+'</div>'+
    (s.credit>0.01?'<div class="small" style="color:var(--grn);font-weight:600">'+(s.balance>0.01?'After a '+money(s.credit)+' credit on your account':'You have a '+money(s.credit)+' credit on your account')+'</div>':'')+
    '<div class="aging"><div><span>0–30 days</span><b>'+money(s.aging.d30)+'</b></div><div><span>31–60</span><b>'+money(s.aging.d60)+'</b></div><div><span>61–90</span><b>'+money(s.aging.d90)+'</b></div><div><span>90+</span><b>'+money(s.aging.over)+'</b></div></div></div>';
  h+='<div class="seg noprint" role="group" aria-label="Date range"><button data-r="90" class="'+(ST.stRange==='90'?'on':'')+'">90 days</button><button data-r="year" class="'+(ST.stRange==='year'?'on':'')+'">This year</button><button data-r="all" class="'+(ST.stRange==='all'?'on':'')+'">All</button></div>';
  h+='<div class="led"><div class="lr h"><div>Date</div><div>Activity</div><div class="num" style="font-family:inherit">Amount</div><div class="num" style="font-family:inherit">Balance</div></div>';
  if(!rows.length)h+='<div class="lr"><div></div><div class="muted">Nothing in this range.</div><div></div><div></div></div>';
  rows.forEach(function(r){
    if(r.type==='invoice')h+='<div class="lr"><div class="muted">'+fd(r.date)+'</div><div><a href="#/invoice/'+esc(r.id)+'" style="text-decoration:none;font-weight:600">Invoice #'+esc(r.number)+'</a></div><div class="num">'+money(r.amount).replace('$','')+'</div><div class="num muted">'+money(r.running).replace('$','')+'</div></div>';
    else h+='<div class="lr"><div class="muted">'+fd(r.date)+'</div><div class="pm">'+(r.method==='Paid in full'?'Paid':'Payment'+(r.method?' · '+esc(r.method):''))+'</div><div class="num" style="color:var(--grn)">'+money(-r.amount).replace('$','')+'</div><div class="num muted">'+money(r.running).replace('$','')+'</div></div>';
  });
  h+='</div>';
  var firstOpen=D.invoices.find(function(v){return v.balance>0.01;});
  if(s.balance>0.01&&firstOpen)h+='<a class="btn pur noprint" href="#/invoice/'+esc(firstOpen.id)+'/zelle" style="height:52px">Pay with Zelle</a>';
  h+='<button class="btn line noprint" id="pr2">Print or save statement (PDF)</button></div>';
  app.innerHTML=h;
  var pr=function(){track('print_statement');window.print();};
  wireBar(pr);$('pr2').onclick=pr;
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){ST.stRange=b.getAttribute('data-r');viewStatement();};});
}

boot();
</script>
