<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://ddxjszzceaullxheejnq.supabase.co; connect-src https://ddxjszzceaullxheejnq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191c20">
<title>DG Equipment Repair — My Account</title>
<link rel="icon" href="portal-logo.png">
<link rel="apple-touch-icon" href="portal-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f5f7;font-family:system-ui,-apple-system,sans-serif}
.boot{width:28px;height:28px;border:3px solid #dcdfe3;border-top-color:#c81f33;border-radius:50%;animation:sp .8s linear infinite;margin:80px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="boot" role="status" aria-label="Loading"></div></div>
<script>
// GitHub Pages (and phones) keep a page for 10 minutes. This page is only a
// loader: the real styles and code are fetched with a unique ?t= every time,
// which no cache can match, so customers always get the latest portal.
(function(){
  var t=Date.now();
  var fail=function(){document.getElementById('app').innerHTML='<p style="text-align:center;margin-top:80px;font-size:16px">Couldn\u2019t load. Check your connection and try again.</p>';};
  var go=function(){var s=document.createElement('script');s.src='portal-app.js?t='+t;s.onerror=fail;document.body.appendChild(s);};
  var l=document.createElement('link');l.rel='stylesheet';l.href='portal-app.css?t='+t;
  l.onload=go;l.onerror=go;   // styles first so nothing flashes unstyled
  document.head.appendChild(l);
})();
</script>
</body>
</html>
